<title>捏捏乐</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap">
<style>
/* 布局：一屏玩具 —— 顶栏 / 全幅舞台画布 / 模式选项 / 底部标签栏 */
:root{
  --bg:#fdf1f6; --bg2:#eaf3ff;
  --ink:#40284a; --muted:#8b7193;
  --panel:rgba(255,255,255,.72); --line:rgba(64,40,74,.12);
  --accent:#ff5f9e; --accent-ink:#ffffff;
  --shadow-rgb:110,50,110;
  --sheet:rgba(170,205,240,.28); --sheet-line:rgba(120,160,210,.35);
  --display:"ZCOOL KuaiLe","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --body:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1f1628; --bg2:#141b30; --ink:#f7eaf4; --muted:#b9a3c0;
  --panel:rgba(44,32,58,.78); --line:rgba(255,255,255,.12);
  --accent:#ff7fb3; --accent-ink:#2a1030; --shadow-rgb:0,0,0;
  --sheet:rgba(120,160,220,.16); --sheet-line:rgba(160,195,255,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1f1628; --bg2:#141b30; --ink:#f7eaf4; --muted:#b9a3c0;
  --panel:rgba(44,32,58,.78); --line:rgba(255,255,255,.12);
  --accent:#ff7fb3; --accent-ink:#2a1030; --shadow-rgb:0,0,0;
  --sheet:rgba(120,160,220,.16); --sheet-line:rgba(160,195,255,.25); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);background-image:radial-gradient(120% 80% at 10% 0%,var(--bg2) 0%,transparent 60%),radial-gradient(90% 70% at 100% 100%,var(--bg2) 0%,transparent 55%);
  color:var(--ink);font-family:var(--body);overflow:hidden;overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.app{height:100%;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px 4px}
.top h1{margin:0;font-family:var(--display);font-weight:400;font-size:1.9rem;letter-spacing:.04em;line-height:1;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.top h1 small{white-space:nowrap;font-family:var(--body);font-size:.75rem;color:var(--muted);letter-spacing:.12em}
.toggles{display:flex;gap:8px}
.tog{white-space:nowrap;flex:none;font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:6px}
.tog::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line)}
.tog.on{color:var(--ink)} .tog.on::before{background:var(--accent)}
.stage{position:relative;flex:1;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hint{position:absolute;left:0;right:0;top:10px;text-align:center;font-size:.85rem;color:var(--muted);letter-spacing:.08em;pointer-events:none;transition:opacity .8s}
.hint.fade{opacity:0}
.counter{position:absolute;left:0;right:0;top:8px;text-align:center;font-family:var(--display);font-size:1.25rem;color:var(--ink);pointer-events:none;font-variant-numeric:tabular-nums}
.controls{display:flex;gap:8px;padding:6px 16px 8px;overflow-x:auto;scrollbar-width:none;min-height:44px;align-items:center}
.controls::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px 7px 8px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:7px}
.chip i{width:18px;height:18px;border-radius:50%;display:block;box-shadow:inset -2px -3px 4px rgba(0,0,0,.18),inset 2px 2px 3px rgba(255,255,255,.6)}
.chip.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.chip.act{background:var(--accent);color:var(--accent-ink);border-color:transparent;padding-left:14px;padding-right:14px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;padding:6px 10px 10px;border-top:1px solid var(--line);background:var(--panel);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tab{font:inherit;background:none;border:0;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;cursor:pointer;border-radius:14px;font-size:.8rem}
.tab .ico{width:26px;height:22px;display:block;transition:transform .25s}
.tab[aria-selected="true"]{color:var(--ink);font-weight:600}
.tab[aria-selected="true"] .ico{transform:scale(1.18) translateY(-1px)}
.ico.slime{background:#ff9ec7;border-radius:55% 45% 50% 50%/60% 60% 40% 40%}
.ico.squish{background:#fff3e6;border:2px solid #f2c9b0;border-radius:50% 50% 44% 44%/62% 62% 38% 38%}
.ico.wrap{background:radial-gradient(circle at 30% 30%,#fff 0 18%,transparent 20%),radial-gradient(circle,#bfe0ff 0 60%,transparent 62%);background-size:11px 11px;border-radius:5px;border:1px solid #9cc7f0}
.ico.ice{border-radius:6px;border:1px solid #8fcfe2;background:linear-gradient(140deg,#effbff 0 40%,#bfe9f5 41% 52%,#7fd0e6 53%)}
.ico.popit{border-radius:50%;background:conic-gradient(#ff8fa3,#ffc36b,#fff07a,#8de39b,#7cc8ff,#b993ff,#ff8fa3)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:420px){.top h1 small{display:none}}
@media (prefers-reduced-motion: reduce){.tab .ico,.hint{transition:none}}
</style>
</head><!--shell-->
<body><!--shell-->
<div class="app">
  <header class="top">
    <h1>捏捏乐<small>史莱姆 · 冰山泥 · 捏捏 · 泡泡纸 · 波普</small></h1>
    <div class="toggles">
      <button id="sndBtn" class="tog" type="button">声音</button>
      <button id="vibBtn" class="tog" type="button">震动</button>
    </div>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" aria-label="解压玩具区，拖拽、按压或点击来玩"></canvas>
    <div id="hint" class="hint"></div>
    <div id="counter" class="counter" hidden></div>
  </main>
  <div class="controls" id="controls"></div>
  <nav class="tabs" role="tablist" aria-label="玩具">
    <button class="tab" role="tab" type="button" data-mode="slime"><span class="ico slime"></span>史莱姆</button>
    <button class="tab" role="tab" type="button" data-mode="ice"><span class="ico ice"></span>冰山泥</button>
    <button class="tab" role="tab" type="button" data-mode="squish"><span class="ico squish"></span>捏捏</button>
    <button class="tab" role="tab" type="button" data-mode="wrap"><span class="ico wrap"></span>泡泡纸</button>
    <button class="tab" role="tab" type="button" data-mode="popit"><span class="ico popit"></span>波普</button>
  </nav>
</div>

<script>
(() => {
'use strict';
const TAU = Math.PI * 2;
const rand = (a = 1, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- 本地设置 ---------- */
const store = {
  get(k, d) { try { const v = localStorage.getItem('nn_' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('nn_' + k, JSON.stringify(v)); } catch (e) {} }
};
const cfg = {
  snd: store.get('snd', true), vib: store.get('vib', true), mode: store.get('mode', 'slime'),
  slime: store.get('slime', 0), ice: store.get('ice', 0), glit: store.get('glit', true), squish: store.get('squish', 0)
};

/* ---------- 声音：全部用 Web Audio 实时合成 ---------- */
const A = { ctx: null, master: null, noise: null };
function audio() {
  if (!cfg.snd) return null;
  if (!A.ctx) {
    const C = window.AudioContext || window.webkitAudioContext;
    if (!C) return null;
    const c = A.ctx = new C();
    const comp = c.createDynamicsCompressor();
    comp.threshold.value = -14; comp.ratio.value = 4;
    A.master = c.createGain(); A.master.gain.value = 0.9;
    A.master.connect(comp); comp.connect(c.destination);
    const len = c.sampleRate * 2, buf = c.createBuffer(1, len, c.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    A.noise = buf;
  }
  if (A.ctx.state === 'suspended') A.ctx.resume();
  return A.ctx;
}
function nz(t, dur, type, f0, f1, Q, g, att = 0.004) {
  const c = A.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), e = c.createGain();
  s.buffer = A.noise; f.type = type; f.Q.value = Q;
  f.frequency.setValueAtTime(f0, t); f.frequency.exponentialRampToValueAtTime(f1, t + dur);
  e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(g, t + att);
  e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(e); e.connect(A.master);
  s.start(t, Math.random() * 1.5); s.stop(t + dur + 0.05);
}
function tone(t, dur, type, f0, f1, g, att = 0.003) {
  const c = A.ctx, o = c.createOscillator(), e = c.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(g, t + att);
  e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(e); e.connect(A.master); o.start(t); o.stop(t + dur + 0.05);
}
const S = {
  ok() { return cfg.snd && A.ctx && A.ctx.state !== 'closed'; },
  // 气泡“啵”：音高快速上扬的短正弦
  bloop(t, f) { tone(t, 0.06 + rand(0.04), 'sine', f, f * rand(1.8, 2.6), 0.18, 0.004); },
  // 史莱姆黏黏的细碎噼啪声
  crackle(n, spread = 0.06, soft = 1) {
    if (!this.ok()) return; const t0 = A.ctx.currentTime;
    for (let k = 0; k < n; k++) nz(t0 + rand(spread), 0.003 + rand(0.009), 'highpass', rand(2200, 5200), 3000, 0.7, (0.04 + rand(0.12)) * soft, 0.001);
  },
  squelch(i) {
    if (!this.ok()) return; const t = A.ctx.currentTime;
    nz(t, 0.16 + 0.12 * i, 'bandpass', rand(300, 480), rand(850, 1300), 2.6, 0.12 + 0.35 * i, 0.012);
    nz(t, 0.12, 'lowpass', 520, 140, 1, 0.08 + 0.3 * i, 0.006);
    const m = 2 + (Math.random() * (2 + i * 4) | 0);
    for (let k = 0; k < m; k++) this.bloop(t + rand(0.15), rand(260, 760));
    this.crackle(5 + (i * 14 | 0), 0.18);
  },
  pop() {
    if (!this.ok()) return; const t = A.ctx.currentTime;
    nz(t, 0.045, 'bandpass', rand(1600, 2600), 800, 1.1, 0.9, 0.0008);
    tone(t, 0.05, 'triangle', rand(600, 900), 170, 0.3, 0.001);
    nz(t + 0.004, 0.07, 'highpass', 4500, 7000, 0.5, 0.07, 0.001);
  },
  thock(up) {
    if (!this.ok()) return; const t = A.ctx.currentTime, b = (up ? 250 : 190) * rand(0.92, 1.08);
    tone(t, 0.09, 'sine', b * 1.7, b * 0.55, 0.55, 0.002);
    nz(t, 0.03, 'lowpass', 1600, 300, 0.8, 0.32, 0.001);
    tone(t, 0.035, 'triangle', b * 3.2, b * 1.4, 0.06, 0.001);
  },
  crinkle(soft = 1) {
    if (!this.ok()) return; const t = A.ctx.currentTime;
    nz(t, 0.012 + rand(0.025), 'bandpass', rand(900, 2600), rand(700, 2000), 2, (0.03 + rand(0.07)) * soft, 0.002);
  },
  puff(i) {
    if (!this.ok()) return; const t = A.ctx.currentTime;
    nz(t, 0.7, 'lowpass', 160, 900, 0.7, 0.04 + 0.12 * i, 0.12);
    for (let k = 0; k < 6; k++) setTimeout(() => this.crinkle(0.5), rand(600));
  },
  flip() {
    if (!this.ok()) return; const t = A.ctx.currentTime;
    nz(t, 0.45, 'bandpass', 300, 2400, 1.4, 0.18, 0.15);
    [523, 659, 784, 1047].forEach((f, k) => tone(t + 0.12 + k * 0.07, 0.18, 'sine', f, f * 1.01, 0.12, 0.004));
  },
  // 冰：极短的宽频脆响 + 高 Q 玻璃共鸣
  iceClick(t, g) {
    nz(t, 0.003 + rand(0.006), 'highpass', rand(2500, 6000), rand(3000, 8000), 0.8, g, 0.0005);
    nz(t, 0.025 + rand(0.04), 'bandpass', rand(2600, 7500), rand(2400, 7000), 14, g * 0.7, 0.001);
  },
  crunch(n) {
    if (!this.ok()) return; const t0 = A.ctx.currentTime;
    nz(t0, 0.012, 'bandpass', rand(1200, 2200), rand(900, 1500), 1.8, 0.55, 0.0006);
    nz(t0, 0.07, 'bandpass', rand(450, 800), 250, 1.4, 0.18 + n * 0.02, 0.002);
    for (let k = 0; k < n * 3 + 2; k++) this.iceClick(t0 + rand(0.06) + k * 0.003, 0.06 + rand(0.22));
    if (Math.random() < 0.5) tone(t0 + rand(0.05), 0.12, 'sine', rand(3800, 6500), rand(3700, 6300), 0.035, 0.001);
  },
  crackRun(n) {
    if (!this.ok()) return; let t = A.ctx.currentTime + 0.01;
    for (let k = 0; k < n; k++) { t += rand(0.004, 0.02) * (1 + k / n); this.iceClick(t, 0.04 + rand(0.16)); }
  },
  freeze() {
    if (!this.ok()) return; const t = A.ctx.currentTime;
    nz(t, 0.9, 'highpass', 3000, 9000, 0.7, 0.05, 0.4);
    for (let k = 0; k < 10; k++) { const f = 2000 + k * 320 + rand(200); tone(t + k * 0.07 + rand(0.03), 0.25, 'sine', f, f * 1.02, 0.03, 0.002); }
  },
  swish() {
    if (!this.ok()) return; const t = A.ctx.currentTime;
    nz(t, 0.35, 'bandpass', 2400, 500, 0.9, 0.14, 0.05);
  }
};
const loops = {};
function loopSet(name, type, Q, level, freq) {
  if (!A.ctx) return;
  let L = loops[name];
  if (!L) {
    if (level <= 0) return;
    const c = A.ctx, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = A.noise; s.loop = true; f.type = type; f.Q.value = Q; g.gain.value = 0;
    s.connect(f); f.connect(g); g.connect(A.master); s.start();
    L = loops[name] = { f, g };
  }
  const t = A.ctx.currentTime;
  L.g.gain.setTargetAtTime(cfg.snd ? level : 0, t, 0.05);
  if (freq) L.f.frequency.setTargetAtTime(freq, t, 0.06);
}
function silenceLoops() { for (const k in loops) loopSet(k, '', 0, 0); }

/* ---------- 震动：安卓用 vibrate，iOS 18+ 用开关控件触发触感 ---------- */
let iosTap = null, lastBuzz = 0, shake = 0;
if (!('vibrate' in navigator)) {
  const l = document.createElement('label'), i = document.createElement('input');
  l.setAttribute('aria-hidden', 'true');
  l.style.cssText = 'position:fixed;left:-200px;top:0;width:1px;height:1px;overflow:hidden;opacity:0;pointer-events:none';
  i.type = 'checkbox'; i.setAttribute('switch', ''); i.tabIndex = -1;
  l.appendChild(i); document.body.appendChild(l);
  iosTap = () => l.click();
}
function buzz(ms, gap = 60) {
  if (!cfg.vib) return;
  const total = Array.isArray(ms) ? ms.reduce((a, v, i) => i % 2 ? a : a + v, 0) : ms;
  if (!reduceMotion) shake = Math.max(shake, Math.min(5, total / 9));
  const t = performance.now();
  if (t - lastBuzz < gap) return;
  lastBuzz = t;
  if (navigator.vibrate) { try { navigator.vibrate(ms); } catch (e) {} }
  else if (iosTap) iosTap();
}

/* ---------- 画布 ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d'), stageEl = document.getElementById('stage');
let W = 0, H = 0, DPR = 1, frame = 0, TH = {};
function readTheme() {
  const cs = getComputedStyle(document.documentElement);
  TH.ink = cs.getPropertyValue('--ink').trim() || '#40284a';
  TH.muted = cs.getPropertyValue('--muted').trim() || '#8b7193';
  TH.shadow = (cs.getPropertyValue('--shadow-rgb').trim() || '110,50,110').split(',').map(Number);
  TH.sheet = cs.getPropertyValue('--sheet').trim();
  TH.sheetLine = cs.getPropertyValue('--sheet-line').trim();
}
function resize() {
  const r = stageEl.getBoundingClientRect();
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = Math.max(1, r.width); H = Math.max(1, r.height);
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  readTheme();
  for (const k in modes) modes[k].resize();
}

/* ---------- 颜色工具 ---------- */
const hex = h => { h = h.replace('#', ''); return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16)); };
const mix = (c, d, t) => c.map((v, i) => Math.round(v + (d[i] - v) * t));
const rgba = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
const WHITE = [255, 255, 255], BLACK = [30, 12, 40];

/* ---------- 软体：弹簧 + 平滑 + 气压（保持体积） ---------- */
class Blob {
  constructor(n) {
    this.n = n; this.p = []; this.v = []; this.r = [];
    for (let i = 0; i < n; i++) { this.p.push({ x: 0, y: 0 }); this.v.push({ x: 0, y: 0 }); this.r.push({ x: 0, y: 0 }); }
    this.ax = 0; this.ay = 0; this.sx = 1; this.sy = 1; this.grabs = new Map(); this.area0 = 1;
  }
  shape(ax, ay, rx, ry, snap) {
    this.ax = ax; this.ay = ay; this.rx = rx; this.ry = ry; this.area0 = Math.PI * rx * ry;
    for (let i = 0; i < this.n; i++) {
      const a = i / this.n * TAU; this.r[i].x = Math.cos(a) * rx; this.r[i].y = Math.sin(a) * ry;
      if (snap) { this.p[i].x = ax + this.r[i].x; this.p[i].y = ay + this.r[i].y; this.v[i].x = this.v[i].y = 0; }
    }
  }
  area() { let s = 0; const p = this.p; for (let i = 0, j = this.n - 1; i < this.n; j = i++) s += p[j].x * p[i].y - p[i].x * p[j].y; return s / 2; }
  contains(x, y) {
    let c = false; const p = this.p;
    for (let i = 0, j = this.n - 1; i < this.n; j = i++)
      if ((p[i].y > y) !== (p[j].y > y) && x < (p[j].x - p[i].x) * (y - p[i].y) / (p[j].y - p[i].y) + p[i].x) c = !c;
    return c;
  }
  step(o) {
    const p = this.p, v = this.v, r = this.r, n = this.n;
    const pf = o.press * (this.area0 - this.area()) / this.area0;
    for (let i = 0; i < n; i++) {
      const a = p[(i + n - 1) % n], b = p[(i + 1) % n], q = p[i];
      let fx = o.k * (this.ax + r[i].x * this.sx - q.x), fy = o.k * (this.ay + r[i].y * this.sy - q.y);
      fx += o.smooth * ((a.x + b.x) / 2 - q.x); fy += o.smooth * ((a.y + b.y) / 2 - q.y);
      fx += pf * (b.y - a.y) * 0.5; fy -= pf * (b.x - a.x) * 0.5;
      v[i].x = (v[i].x + fx) * o.damp; v[i].y = (v[i].y + fy) * o.damp;
    }
    for (let i = 0; i < n; i++) { p[i].x += v[i].x; p[i].y += v[i].y; }
    for (const g of this.grabs.values()) {
      const dx = g.x - g.x0, dy = g.y - g.y0;
      for (let i = 0; i < n; i++) {
        const w = g.w[i] * o.grab; if (w < 0.004) continue;
        const tx = g.s[i].x + dx * g.w[i], ty = g.s[i].y + dy * g.w[i];
        p[i].x += (tx - p[i].x) * w; p[i].y += (ty - p[i].y) * w;
        v[i].x *= 1 - w; v[i].y *= 1 - w;
      }
    }

/* ========== 3. 泡泡纸 ========== */
const wrap = {
  cells: [], count: store.get('popped', 0), slide: 0, r: 24, sheet: null, ptr: new Map(),
  hint: '点或者划过去，一路捏爆',
  resize() { this.layout(); },
  layout() {
    const m = 16, r = this.r = clamp(Math.min(W, H) / 13, 16, 32), gx = r * 2.3, gy = gx * 0.866;
    const cols = Math.max(2, Math.floor((W - m * 2 - r * 2.4) / gx) + 1), rows = Math.max(2, Math.floor((H - 48 - m - r * 2.4) / gy) + 1);
    const sw = (cols - 1) * gx + gx / 2 + r * 2.6, sh = (rows - 1) * gy + r * 2.6, x0 = (W - sw) / 2, y0 = 44 + (H - 44 - m - sh) / 2;
    this.sheet = { x: x0, y: y0, w: sw, h: sh };
    const old = this.cells; this.cells = [];
    for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
      const o = old[this.cells.length];
      this.cells.push({ x: x0 + r * 1.3 + i * gx + (j % 2 ? gx / 2 : 0), y: y0 + r * 1.3 + j * gy, pop: o ? o.pop : false, t: 0, shape: o ? o.shape : null });
    }
  },
  hit(id, x, y) {
    if (this.slide > 0.05) return;
    for (const c of this.cells) if (!c.pop && Math.hypot(c.x - x, c.y - y) < this.r * 1.05) {
      c.pop = true; c.t = 1; c.shape = Array.from({ length: 9 }, () => rand(0.7, 1));
      this.count++; S.pop(); buzz(20, 20); updateCounter();
      if (this.count % 10 === 0) store.set('popped', this.count);
      if (this.cells.every(q => q.pop)) setTimeout(() => this.refill(), 650);
    }
  },
  down(id, x, y) { this.hit(id, x, y); },
  move(id, x, y) { this.hit(id, x, y); },
  up() { store.set('popped', this.count); },
  refill() { for (const c of this.cells) { c.pop = false; c.t = 0; } this.slide = 1; S.swish(); buzz(25, 0); },

      ctx.fillStyle = rgba(sunk, (0.55 - 0.3 * c.melt) * st.ia + 0.1); ctx.fill();
      ctx.strokeStyle = `rgba(255,255,255,${0.4 * (1 - c.melt * 0.6)})`; ctx.lineWidth = 1; ctx.stroke(); ctx.restore();
    }
    // 完整的冰面（一条路径填充，接缝不露线）
    ctx.globalAlpha = fa;
    ctx.beginPath(); for (const c of cells) if (c.st === 0 || c.st === 1) addPoly(c.poly);
    ctx.fillStyle = rgba(ic, st.ia); ctx.fill();
    ctx.globalAlpha = fa * (st.ia > 0.8 ? 0.9 : 0.55); ctx.fillStyle = this.pattern(); ctx.fill();
    ctx.globalAlpha = fa;
    for (const c of cells) if (c.st === 1) {
      ctx.beginPath(); addPoly(c.poly);
      ctx.fillStyle = c.sh < 0.5 ? `rgba(255,255,255,${0.16 * (0.5 - c.sh)})` : rgba(deep, 0.12 * (c.sh - 0.5)); ctx.fill();
    }
    // 裂缝与冰层断面
    const thin = new Path2D(), thick = new Path2D();
    for (let k = 0; k < cells.length; k++) {
      const c = cells[k]; if (c.st > 1) continue; const P = c.poly;
      for (let i = 0; i < P.length; i++) {
        const e = P[i].e; if (e < 0) continue; const n = cells[e], a = P[i], b = P[(i + 1) % P.length];
        if (n.st === 2) { thick.moveTo(a.x, a.y); thick.lineTo(b.x, b.y); }
        else if (n.st !== 3 && k < e && (c.st === 1 || n.st === 1) && (k * 7919 + e * 104729) % 10 < 4) { thin.moveTo(a.x, a.y); thin.lineTo(b.x, b.y); }
      }
    }
    ctx.lineCap = 'round';
    ctx.save(); ctx.translate(1.2, 1.8); ctx.strokeStyle = rgba(deep, 0.45); ctx.lineWidth = 3; ctx.stroke(thick); ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.95)'; ctx.lineWidth = 2.2; ctx.stroke(thick);
    ctx.save(); ctx.translate(0.7, 0.7); ctx.strokeStyle = rgba(deep, 0.3); ctx.lineWidth = 0.7; ctx.stroke(thin); ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 1; ctx.stroke(thin);
    const rp = new Path2D();
    for (const r of this.rays) {
      const n = Math.ceil(r.g * (r.pts.length - 1)); rp.moveTo(r.pts[0].x, r.pts[0].y);
      for (let i = 1; i <= n; i++) {
        const p = r.pts[i], q = r.pts[i - 1], cp = cells[p.k], cq = cells[q.k];
        if ((cp && cp.st === 2) || (cq && cq.st === 2)) rp.moveTo(p.x, p.y); else rp.lineTo(p.x, p.y);
      }
    }
    ctx.save(); ctx.translate(0.6, 0.8); ctx.strokeStyle = rgba(deep, 0.28); ctx.lineWidth = 0.8; ctx.stroke(rp); ctx.restore();
    ctx.strokeStyle = 'rgba(255,255,255,.9)'; ctx.lineWidth = 1.1; ctx.stroke(rp);
    ctx.globalAlpha = 1;
    // 表面反光
    const lg = ctx.createLinearGradient(t.x, t.y, t.x + t.w, t.y + t.h);
    lg.addColorStop(0.12, 'rgba(255,255,255,0)'); lg.addColorStop(0.28, 'rgba(255,255,255,.16)'); lg.addColorStop(0.4, 'rgba(255,255,255,0)');
    ctx.fillStyle = lg; ctx.fillRect(t.x, t.y, t.w, t.h);
    for (const p of this.ptr.values()) {
      const pr = this.cs * (1.3 + Math.min(1.2, p.hold / 90)), fg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, pr);
      fg.addColorStop(0, rgba(deep, 0.22)); fg.addColorStop(1, rgba(deep, 0)); ctx.fillStyle = fg; ctx.beginPath(); ctx.arc(p.x, p.y, pr, 0, TAU); ctx.fill();
    }
    ctx.restore();
    // 玻璃盘边
    this.trayPath(); ctx.lineWidth = 7; ctx.strokeStyle = rgba(mix(deep, WHITE, 0.3), 0.55); ctx.stroke();
    ctx.lineWidth = 1.5; ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.stroke();
    for (const b of this.bits) {
      ctx.fillStyle = `rgba(255,255,255,${b.life})`; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.r);
      ctx.beginPath(); ctx.moveTo(0, -b.s); ctx.lineTo(b.s, b.s * 0.7); ctx.lineTo(-b.s * 0.8, b.s * 0.5); ctx.closePath(); ctx.fill(); ctx.restore();
    }
  },
  controls() {
    return this.styles.map((s, i) => `<button class="chip${i === cfg.ice ? ' sel' : ''}" type="button" data-ice="${i}"><i style="background:linear-gradient(135deg,${rgba(s.ice)} 0 45%,${s.slime} 46%)"></i>${s.n}</button>`).join('')
      + `<button class="chip act" type="button" data-freeze="1">重新结冰</button>`;
  }
};

const modes = { slime, ice, squish, wrap, popit };
slime.init(); squish.init();
const hashMode = location.hash.slice(1);
if (modes[hashMode]) cfg.mode = hashMode;
if (!modes[cfg.mode]) cfg.mode = 'slime';

/* ---------- 界面 ---------- */
const $ = s => document.querySelector(s);
const hintEl = $('#hint'), counterEl = $('#counter'), controlsEl = $('#controls');
const sndBtn = $('#sndBtn'), vibBtn = $('#vibBtn');
function updateCounter() { counterEl.textContent = cfg.mode === 'ice' ? `冰面碎了 ${Math.round(ice.broken / ice.total * 100)}%` : `已捏爆 ${wrap.count} 个`; }
function syncToggles() {
  sndBtn.classList.toggle('on', cfg.snd); sndBtn.setAttribute('aria-pressed', cfg.snd);
  vibBtn.classList.toggle('on', cfg.vib); vibBtn.setAttribute('aria-pressed', cfg.vib);
}
function setMode(m) {
  const prev = modes[cfg.mode];
  if (prev) { prev.b && prev.b.grabs.clear(); prev.presses && prev.presses.clear(); prev.ptr && prev.ptr.clear && prev !== wrap && prev.ptr.clear(); }
  silenceLoops();
  cfg.mode = m; store.set('mode', m);
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', t.dataset.mode === m));
  const showCount = m === 'wrap' || m === 'ice';
  counterEl.hidden = !showCount; hintEl.hidden = showCount; updateCounter();
  hintEl.textContent = modes[m].hint; hintEl.classList.remove('fade');
  controlsEl.innerHTML = modes[m].controls();
}
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('.tab'); if (!t) return; setMode(t.dataset.mode); buzz(8, 0);
});
sndBtn.addEventListener('click', () => { cfg.snd = !cfg.snd; store.set('snd', cfg.snd); syncToggles(); if (cfg.snd) audio(); else silenceLoops(); });
vibBtn.addEventListener('click', () => { cfg.vib = !cfg.vib; store.set('vib', cfg.vib); syncToggles(); buzz(30, 0); });
controlsEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return; const d = b.dataset; audio();
  if (d.slime) { cfg.slime = +d.slime; store.set('slime', cfg.slime); S.squelch(0.4); buzz(12, 0); }
  if (d.glit) { cfg.glit = !cfg.glit; store.set('glit', cfg.glit); S.crackle(10, 0.15); }
  if (d.reset) slime.reset();
  if (d.squish) { cfg.squish = +d.squish; store.set('squish', cfg.squish); squish.sq = 0.6; S.puff(0.6); buzz(12, 0); }
  if (d.ice) { cfg.ice = +d.ice; store.set('ice', cfg.ice); ice.gen(); S.freeze(); buzz(12, 0); updateCounter(); }
  if (d.freeze) ice.refreeze();
  if (d.refill) wrap.refill();
  if (d.zero) { wrap.count = 0; store.set('popped', 0); updateCounter(); }
  if (d.flip) popit.doFlip();
  if (d.allup) { popit.cells.forEach(c => { c.dn = false; c.t = 1; }); S.thock(true); buzz(20, 0); }
  controlsEl.innerHTML = modes[cfg.mode].controls();
});

/* ---------- 指针 ---------- */
function pos(e) { const r = cv.getBoundingClientRect(); return [e.clientX - r.left, e.clientY - r.top]; }
const active = new Set();
cv.addEventListener('pointerdown', e => {
  e.preventDefault(); audio();
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  active.add(e.pointerId); hintEl.classList.add('fade');
  modes[cfg.mode].down(e.pointerId, ...pos(e));
});
cv.addEventListener('pointermove', e => {
  if (!active.has(e.pointerId)) return;
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) modes[cfg.mode].move(e.pointerId, ...pos(ev));
});
const end = e => { if (!active.delete(e.pointerId)) return; modes[cfg.mode].up(e.pointerId); };
cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end); cv.addEventListener('lostpointercapture', end);
cv.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden) silenceLoops(); });

/* ---------- 主循环 ---------- */
let last = performance.now(), acc = 0;
function loop(now) {
  acc += Math.min(100, now - last); last = now;
  const m = modes[cfg.mode];
  while (acc >= 1000 / 60) { m.tick(); acc -= 1000 / 60; }
  if (++frame % 45 === 0) readTheme();
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0); ctx.clearRect(0, 0, W, H);
  if (shake > 0.2) { ctx.translate(rand(-shake, shake), rand(-shake, shake)); shake *= 0.82; } else shake = 0;
  m.draw();
  requestAnimationFrame(loop);
}
new ResizeObserver(resize).observe(stageEl);
resize(); syncToggles(); setMode(cfg.mode);
requestAnimationFrame(loop);
})();
</script>
